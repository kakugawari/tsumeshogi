<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詰将棋チェッカー</title>
<meta name="description" content="盤に駒を並べて、詰むかどうかと何手詰めかを調べる">
<meta name="theme-color" content="#151a2e">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <h1 class="title">詰将棋チェッカー</h1>
    <div class="topbar-actions">
      <button type="button" id="btnSample" class="btn">お試し局面</button>
      <button type="button" id="btnClear" class="btn">最初から</button>
    </div>
  </header>

  <main id="stage">

    <!-- 玉方(守り)の駒台。使っていない駒はぜんぶここに入っている -->
    <section class="stand" id="standWhite">
      <span class="stand-label" id="standWhiteLabel">玉方の駒台</span>
      <div class="stand-chips" id="standWhiteChips"></div>
    </section>

    <section id="boardSection">
      <div id="boardOuter">
        <div id="fileLabels" aria-hidden="true"></div>
        <div id="boardRow">
          <div id="rankLabels" aria-hidden="true"></div>
          <div id="board" role="group" aria-label="盤面"></div>
        </div>
      </div>
    </section>

    <!-- 攻方(攻め)の持ち駒 -->
    <section class="stand" id="standBlack">
      <span class="stand-label" id="standBlackLabel">攻方の持ち駒</span>
      <div class="stand-chips" id="standBlackChips"></div>
    </section>

    <section id="toolSection">
      <p class="pick-status" id="pickStatus">駒台の駒をタップして選び、盤をタップすると置けます。</p>
      <div class="tool-row">
        <span class="tool-caption">駒箱</span>
        <button type="button" id="boxKing" class="chip chip-box" aria-pressed="false">玉</button>
        <button type="button" id="toolErase" class="tool" aria-pressed="false">消す</button>
      </div>
      <p class="tool-hint">
        盤の駒をタップすると選べます。そのまま<b>空いたマスをタップすると移動</b>、
        <b>もう一度同じ駒をタップすると 攻め → 守り → 成った攻め → 成った守り</b> と変わります。<br>
        詰将棋の決めごとどおり、<b>玉方の駒台に残った駒は玉方が合駒に使えます</b>。
        使わせたくない駒は攻方の持ち駒へ渡してください。
      </p>
    </section>

    <section id="controlsSection">
      <label class="turn-select">
        攻方(手番):
        <select id="turnSelect">
          <option value="b">先手</option>
          <option value="w">後手</option>
        </select>
      </label>
      <button type="button" id="btnCheck" class="btn btn-primary">詰みチェック</button>
      <button type="button" id="btnCancel" class="btn" hidden>やめる</button>
    </section>

    <section id="resultSection" aria-live="polite">
      <p class="result-headline" id="resultHeadline">局面を作ってから「詰みチェック」を押す</p>
      <ul class="result-warnings" id="resultWarnings"></ul>
      <ol class="result-moves" id="resultMoves"></ol>
      <p class="result-note" id="resultNote"></p>
    </section>

    <details id="sfenSection">
      <summary>SFEN で読み込み・書き出し</summary>
      <textarea id="sfenText" rows="3" spellcheck="false" placeholder="例: 9/9/9/9/4k4/9/9/9/4K4 b P 1"></textarea>
      <div class="sfen-actions">
        <button type="button" id="btnLoadSfen" class="btn">読み込む</button>
        <button type="button" id="btnExportSfen" class="btn">今の盤面を書き出す</button>
      </div>
    </details>

  </main>
</div>

<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
